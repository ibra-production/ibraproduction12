name: Ibra Production Automation

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  process-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/automation-runner.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          BAR9_API_KEY: ${{ secrets.BAR9_API_KEY }}
          BAR9_TEMPLATE_ID: ${{ secrets.BAR9_TEMPLATE_ID }}
          BAR9_LANGUAGE: ${{ secrets.BAR9_LANGUAGE }}
          IBRA_OWNER_PHONE: ${{ secrets.IBRA_OWNER_PHONE }}
